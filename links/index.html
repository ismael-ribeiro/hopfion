<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hopfion Pull Apart</title>
<style>
:root{--bg1:#f1f2f4;--bg2:#b9bcc2;--panel:rgba(255,255,255,.9);--text:#1d2026;--muted:#5b6270;--accent:#3b6fd8;--line:rgba(0,0,0,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2d33;--bg2:#0c0d10;--panel:rgba(28,31,37,.92);--text:#e8eaee;--muted:#9aa1ad;--accent:#7aa2ff;--line:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--bg1:#2a2d33;--bg2:#0c0d10;--panel:rgba(28,31,37,.92);--text:#e8eaee;--muted:#9aa1ad;--accent:#7aa2ff;--line:rgba(255,255,255,.12)}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(var(--bg1),var(--bg2))}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#ui{position:fixed;top:16px;left:16px;width:290px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;
  background:var(--panel);border-radius:12px;padding:14px 16px;box-sizing:border-box;box-shadow:0 6px 24px rgba(0,0,0,.18)}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.row{margin:10px 0}
.row label{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.row label span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
#stage,#pstat{font-size:12px;color:var(--muted);margin-top:2px}
#pstat.stuck{color:#b07a00;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #pstat.stuck{color:#ffcc33}}
:root[data-theme="dark"] #pstat.stuck{color:#ffcc33}
.sub a{color:var(--accent)}
.q{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.q b{font-size:18px}
.q div{font-size:12px;color:var(--muted)}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.chk{display:flex;gap:6px;align-items:center;margin:4px 0}
.row label.chk{justify-content:flex-start;font-weight:400;margin-top:8px}
body.simple .full,body.simple .sub,body.simple h1,body.simple #vs{display:none}
body.simple #ui{width:260px}
#hint{position:fixed;right:16px;bottom:12px;font-size:12px;color:var(--muted)}
@media (max-width:600px){#ui{top:auto;bottom:8px;left:8px;max-height:45vh;padding:10px 12px}#hint{display:none}}
</style>
</head>
<body>
<div id="ui">
  <h1>Hopfion: pull the loops apart</h1>
  <div class="sub">Linked loops get stuck, unlinked ones slide free · <a href="../">builder</a></div>
  <div class="row"><label><b>Pull apart</b> <span id="vpa"></span></label>
    <input id="pa" type="range" min="0" max="1" step="0.001" value="0"><div id="pstat"></div>
    <label class="chk"><input id="cc" type="checkbox" checked> Contact balls</label></div>
  <div class="row"><label><b>Skyrmion → Hopfion</b> <span id="vs"></span></label>
    <input id="s" type="range" min="0" max="1" step="0.001" value="1"><div id="stage"></div>
    <label class="chk"><input id="po" type="checkbox"> Show only the planes</label></div>
  <div class="full">
  <div class="row"><label><b>Poloidal winding n<sub>pol</sub></b> <span id="vnp"></span></label>
    <input id="np" type="range" min="-5" max="5" step="1" value="-1"></div>
  <div class="row"><label><b>Toroidal winding n<sub>tor</sub></b> <span id="vnt"></span></label>
    <input id="nt" type="range" min="-5" max="5" step="1" value="1"></div>
  <div class="row"><label><b>Helicity γ</b> <span id="vg"></span></label>
    <input id="g" type="range" min="-180" max="180" step="1" value="0"></div>
  <div class="q"><b id="qh"></b><div id="qtext"></div></div>
  <details><summary>Display</summary>
    <div class="row"><label><b>Torus opacity</b> <span id="vop"></span></label>
      <input id="op" type="range" min="0" max="1" step="0.01" value="0.45"></div>
    <label class="chk"><input id="cl" type="checkbox" checked> Preimage loops</label>
    <label class="chk"><input id="ct" type="checkbox" checked> Tracer arrows</label>
    <label class="chk"><input id="cs" type="checkbox" checked> Spin lattice (finished hopfion)</label>
  </details>
  </div>
</div>
<div id="hint">drag: rotate · scroll / pinch: zoom · right-drag: pan</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- texture (same as hopfion_nodes.py)
// m = (sin t cos P, sin t sin P, -cos t),  t = pi min(rho/a, 1),  P = n_pol alpha + n_tor phi + gamma
// core ring down, background up (polarity -1);  Q_H = -n_pol n_tor  (Goebel et al. convention)
const R = 4, A = 4, RHO = A / 2, TWO = 2 * Math.PI, N = 400, K = 10, J = 4;
const st = {s: 1, np: -1, nt: 1, g: 0, op: .45, loops: true, tracers: true, spins: true, pa: 0, cc: true};

const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => x * x * (3 - 2 * x);
function phase(s) {
  return {a: ease(clamp(s / .2)), b: ease(clamp((s - .2) / .2)), psi: TWO * clamp((s - .4) / .6)};
}
function m0(u, w) {                       // spins of the cross-section (sheet), at azimuth 0
  const rho = Math.hypot(u, w), th = Math.PI * Math.min(rho / A, 1), P = st.np * Math.atan2(w, u) + st.g;
  return new THREE.Vector3(Math.sin(th) * Math.cos(P), Math.sin(th) * Math.sin(P), -Math.cos(th));
}
function mField(x, y, z) {
  const ph = Math.atan2(y, x), u = Math.hypot(x, y) - R;
  return m0(u, z).applyAxisAngle(Z, st.nt * ph);
}
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
function spinColor(m, c = new THREE.Color()) {
  const h = ((Math.atan2(m.y, m.x) / TWO) % 1 + 1) % 1;
  return c.setHSL(h, 1, .5 + .5 * Math.tanh(1.5 * m.z) / Math.tanh(1.5));
}

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, .1, 500);
camera.up.copy(Z); camera.position.set(6, -27, 17);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 5; controls.maxDistance = 90;
scene.add(new THREE.HemisphereLight(0xffffff, 0x666670, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(10, -12, 18); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .8); rim.position.set(-14, 10, 6); scene.add(rim);
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const narrow = innerWidth < 600; controls.target.set(0, 0, narrow ? -3 : 0);
}
addEventListener('resize', resize); resize();

// arrow geometry along +y, centred
function arrowGeometry(L, rs, rh) {
  const shaft = new THREE.CylinderGeometry(rs, rs, .58 * L, 12); shaft.translate(0, -.21 * L, 0);
  const head = new THREE.ConeGeometry(rh, .42 * L, 16); head.translate(0, .29 * L, 0);
  const g = mergeGeoms([shaft, head]); return g;
}
function mergeGeoms(gs) {
  const pos = [], nor = [], idx = []; let off = 0;
  for (const g of gs) {
    const gi = g.index ? g : g.toNonIndexed();
    pos.push(...gi.attributes.position.array); nor.push(...gi.attributes.normal.array);
    if (gi.index) for (const i of gi.index.array) idx.push(i + off);
    off += gi.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setIndex(idx); return out;
}
function arrows(max, L, rs, rh, opacity = 1) {
  const mat = new THREE.MeshStandardMaterial({roughness: .45, metalness: 0, transparent: opacity < 1, opacity});
  const im = new THREE.InstancedMesh(arrowGeometry(L, rs, rh), mat, max);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); im.count = 0; scene.add(im);
  im.setColorAt(0, new THREE.Color()); return im;
}
const sheetArrows = arrows(17 * 17, .45, .035, .09);
const fixedArrows = arrows(17 * 17, .45, .035, .09);     // copy of the sheet left at azimuth 0
const tracerArrows = arrows(J * 5 * K, 1.0, .06, .16);
const latticeArrows = arrows(17 * 17 * 5, .7, .045, .11);
const bgArrows = arrows(17 * 17 * 5, .5, .03, .08, .25);
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(1, 1, 1), tmpC = new THREE.Color();
function putArrow(im, i, pos, dir, color) {
  tmpQ.setFromUnitVectors(Y, dir.clone().normalize());
  im.setMatrixAt(i, tmpM.compose(pos, tmpQ, tmpS)); im.setColorAt(i, color);
}
function finishArrows(im, n) {
  im.count = n; im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
}

// sheets coloured by their spins (spin colour map), so the two skyrmions can be compared
function colouredSheet() {
  const g = new THREE.PlaneGeometry(2 * A, 2 * A, 80, 80);
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 3), 3));
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors: true, transparent: true, opacity: .8,
    side: THREE.DoubleSide, depthWrite: false}));
  mesh.matrixAutoUpdate = false; scene.add(mesh); return mesh;
}
function paintSheet(mesh, spinAt) {              // spinAt(xi, eta) -> world spin
  const p = mesh.geometry.attributes.position, c = mesh.geometry.attributes.color;
  for (let i = 0; i < p.count; i++) { spinColor(spinAt(p.getX(i), p.getY(i)), tmpC); c.setXYZ(i, tmpC.r, tmpC.g, tmpC.b); }
  c.needsUpdate = true;
}
const edgeGeom = new THREE.EdgesGeometry(new THREE.PlaneGeometry(2 * A, 2 * A));
const sheetPlane = colouredSheet();
const sheetEdge = new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({color: 0x777c85}));
sheetEdge.matrixAutoUpdate = false; scene.add(sheetEdge);
const Mfixed = new THREE.Matrix4().makeTranslation(R, 0, 0).multiply(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
const fixedPlane = colouredSheet(); fixedPlane.matrix.copy(Mfixed);
const fixedEdge = new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({color: 0x4a7fd6}));
fixedEdge.matrixAutoUpdate = false; fixedEdge.matrix.copy(Mfixed); scene.add(fixedEdge);

const torusMat = new THREE.MeshStandardMaterial({vertexColors: true, roughness: .4, transparent: true,
  side: THREE.DoubleSide, depthWrite: false});
const torus = new THREE.Mesh(new THREE.BufferGeometry(), torusMat); torus.renderOrder = 2; scene.add(torus);
const loopMat = new THREE.MeshStandardMaterial({vertexColors: true, roughness: .35});
const loopGroup = new THREE.Group(); scene.add(loopGroup);

// ---------------------------------------------------------------- build
function loopPoint(phi, alpha) {
  const s = R + RHO * Math.cos(alpha);
  return new THREE.Vector3(s * Math.cos(phi), s * Math.sin(phi), RHO * Math.sin(alpha));
}
function wrap2pi(x) { return ((x % TWO) + TWO) % TWO; }
// preimage curves of direction j (in-plane angle j pi/2, m_z = 0): list of point lists
function preimageCurves(j, psi) {
  const Pj = j * TWO / J, curves = [];
  if (st.np !== 0) {
    for (let b = 0; b < Math.abs(st.np); b++) {
      const pts = [], n = Math.max(2, Math.round(N * psi / TWO));
      for (let k = 0; k <= n; k++) {
        const phi = psi * k / n, alpha = (Pj - st.g - st.nt * phi + TWO * b) / st.np;
        pts.push(loopPoint(phi, alpha));
      }
      curves.push({pts, closed: false, b});
    }
  } else if (st.nt !== 0) {
    for (let b = 0; b < Math.abs(st.nt); b++) {
      const phi = wrap2pi((Pj - st.g + TWO * b) / st.nt);
      if (phi >= psi) continue;
      const pts = [];
      for (let k = 0; k < N / 2; k++) pts.push(loopPoint(phi, TWO * k / (N / 2)));
      curves.push({pts, closed: true, b, phi});
    }
  }
  return curves;
}

// ---------------------------------------------------------------- pull apart (as in hopfion_links.blend)
// Loop = one closed preimage: direction j, branch b mod g, g = gcd(|n_pol|, |n_tor|); M = J g loops.
// Each slides rigidly along z: by number, step (m - (M-1)/2) per unit of pull, or for n_tor = 0
// (horizontal circles) by stretching z.  At 1 the first and last loop are 2.5 rho + 2 r apart, in
// separate height bands, so linked loops must touch on the way: the pull stops at the first touch.
const TUBE = .08, TOUCH = 2 * TUBE, BALL = 5 * TUBE;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function pullSetup() {
  const g = Math.max(gcd(Math.abs(st.np), Math.abs(st.nt)), 1), M = J * g, mid = (M - 1) / 2;
  const step = (2.5 * RHO + TOUCH) / Math.max(M - 1, 1);
  return {g, mid, step, rings: st.nt === 0 && st.np !== 0, stretch: step * mid / RHO};
}
const speed = (P, m, z) => P.rings ? P.stretch * z : P.step * (m - P.mid);

// first pull at which two tubes touch (2: never).  All motion is vertical, so two loop points can only
// meet if they are within 2r seen from above; for each such pair the vertical gap closes linearly.
function findContact(curves, P) {
  const xs = [], ys = [], zs = [], vs = [], ms = [], UP = 4;
  const add = (p, m) => { xs.push(p.x); ys.push(p.y); zs.push(p.z); vs.push(speed(P, m, p.z)); ms.push(m); };
  for (const c of curves) {
    const n = c.pts.length, segs = c.closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const a = c.pts[i], b = c.pts[(i + 1) % n];
      for (let s = 0; s < UP; s++) add(a.clone().lerp(b, s / UP), c.m);
    }
    if (!c.closed) add(c.pts[n - 1], c.m);
  }
  const cell = new Map(), key = (ix, iy) => (ix + 4096) * 8192 + (iy + 4096);
  for (let i = 0; i < xs.length; i++) {
    const k = key(Math.floor(xs[i] / TOUCH), Math.floor(ys[i] / TOUCH));
    let a = cell.get(k); if (!a) cell.set(k, a = []); a.push(i);
  }
  let lam = 2; const hits = [];
  for (let i = 0; i < xs.length; i++) {
    const ix = Math.floor(xs[i] / TOUCH), iy = Math.floor(ys[i] / TOUCH);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const a = cell.get(key(ix + dx, iy + dy)); if (!a) continue;
      for (const j of a) {
        if (j <= i || ms[j] === ms[i]) continue;
        const dh = Math.hypot(xs[i] - xs[j], ys[i] - ys[j]); if (dh >= TOUCH) continue;
        const dv = vs[i] - vs[j]; if (Math.abs(dv) < 1e-6) continue;
        const w = Math.sqrt(TOUCH * TOUCH - dh * dh), dz0 = zs[i] - zs[j];
        if (Math.abs(dz0) < w) continue;                       // touching at rest: ignored
        const enter = Math.min((-w - dz0) / dv, (w - dz0) / dv);
        if (enter <= 0 || enter > 1.0001) continue;
        hits.push([enter, i, j]); lam = Math.min(lam, enter);
      }
    }
  }
  const spots = [];                                            // where the first touch happens
  for (const [enter, i, j] of hits) {
    if (enter > lam + 1e-3) continue;
    const p = new THREE.Vector3((xs[i] + xs[j]) / 2, (ys[i] + ys[j]) / 2,
      (zs[i] + zs[j]) / 2 + lam * (vs[i] + vs[j]) / 2);
    if (!spots.some(q => q.distanceTo(p) < 3 * BALL)) spots.push(p);
  }
  return {lam, spots};
}
let contactKey = '', contact = {lam: 2, spots: []};
const balls = new THREE.InstancedMesh(new THREE.SphereGeometry(BALL, 32, 16),
  new THREE.MeshStandardMaterial({color: 0xffc400, roughness: .3}), 64);
balls.count = 0; scene.add(balls);

function build() {
  const {a, b, psi} = phase(st.s);
  const sweeping = st.s > .4, done = st.s >= .999;
  const pulled = st.pa > 1e-4;        // moved loops are no longer preimages: hide the torus and the spins

  // sheet: flat skyrmion -> spins turn -> stands up at x = R -> sweeps round z
  const Msheet = new THREE.Matrix4().makeRotationZ(psi)
    .multiply(new THREE.Matrix4().makeTranslation(R * b, 0, 0))
    .multiply(new THREE.Matrix4().makeRotationX(-Math.PI / 2 * b));
  sheetPlane.matrix.copy(Msheet); sheetEdge.matrix.copy(Msheet);
  sheetPlane.visible = sheetEdge.visible = !done;
  if (!done) paintSheet(sheetPlane, (xi, eta) => m0(xi, -eta).applyAxisAngle(X, -1.5 * Math.PI * a)
    .applyAxisAngle(X, -Math.PI / 2 * b).applyAxisAngle(Z, st.nt * psi));
  let n = 0;
  if (!done) for (let i = 0; i <= 16; i++) for (let k = 0; k <= 16; k++) {
    const xi = -A + i * .5, eta = -A + k * .5;
    const m = m0(xi, -eta).applyAxisAngle(X, -1.5 * Math.PI * a).applyAxisAngle(X, -Math.PI / 2 * b)
      .applyAxisAngle(Z, st.nt * psi);
    const pos = new THREE.Vector3(xi, eta, 0).applyMatrix4(Msheet);
    pos.addScaledVector(new THREE.Vector3(0, 0, 1).transformDirection(Msheet), .02);
    putArrow(sheetArrows, n++, pos, m, spinColor(m, tmpC));
  }
  finishArrows(sheetArrows, n);

  // a copy of the standing skyrmion stays at azimuth 0, to compare with the moving one
  const showFixed = sweeping && !done;
  fixedPlane.visible = fixedEdge.visible = showFixed;
  if (showFixed) paintSheet(fixedPlane, (xi, eta) => m0(xi, -eta));
  let nf = 0;
  if (showFixed) for (let i = 0; i <= 16; i++) for (let k = 0; k <= 16; k++) {
    const xi = -A + i * .5, eta = -A + k * .5, m = m0(xi, -eta);
    const pos = new THREE.Vector3(xi, eta, 0).applyMatrix4(Mfixed).add(new THREE.Vector3(0, -.02, 0));
    putArrow(fixedArrows, nf++, pos, m, spinColor(m, tmpC));
  }
  finishArrows(fixedArrows, nf);

  // torus m_z = 0 (rho = a/2), grown behind the sheet
  torus.geometry.dispose();
  torus.visible = sweeping && st.op > .01 && !st.po && !pulled;
  if (torus.visible) {
    const nu = Math.max(2, Math.round(192 * psi / TWO)), nv = 64, pos = [], col = [], idx = [];
    for (let i = 0; i <= nu; i++) for (let k = 0; k <= nv; k++) {
      const phi = psi * i / nu, al = TWO * k / nv, p = loopPoint(phi, al);
      pos.push(p.x, p.y, p.z);
      const P = st.np * al + st.nt * phi + st.g;
      spinColor(new THREE.Vector3(Math.cos(P), Math.sin(P), 0), tmpC); col.push(tmpC.r, tmpC.g, tmpC.b);
    }
    for (let i = 0; i < nu; i++) for (let k = 0; k < nv; k++) {
      const q = i * (nv + 1) + k; idx.push(q, q + nv + 1, q + 1, q + 1, q + nv + 1, q + nv + 2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals(); torus.geometry = g;
    torusMat.opacity = st.op; torusMat.depthWrite = st.op > .97;
  }

  // preimage loops and tracers, moved by Pull apart
  const P = pullSetup(), curves = [];
  if (sweeping && !st.po) for (let j = 0; j < J; j++) for (const c of preimageCurves(j, psi)) {
    c.j = j; c.m = (c.b % P.g) * J + j; curves.push(c);
  }
  const ck = [st.np, st.nt, st.g, st.s, st.po].join();
  if (ck !== contactKey) { contact = findContact(curves, P); contactKey = ck; }
  const pull = Math.min(st.pa, contact.lam), stuck = pulled && st.pa >= contact.lam - 1e-5;
  const lift = (p, m) => new THREE.Vector3(p.x, p.y, p.z + pull * speed(P, m, p.z));
  for (const c of loopGroup.children) c.geometry.dispose();
  loopGroup.clear();
  let nt = 0;
  for (let j = 0; j < J; j++) {
    const Pj = j * TWO / J, dir = new THREE.Vector3(Math.cos(Pj), Math.sin(Pj), 0), color = spinColor(dir);
    for (const c of curves) {
      if (c.j !== j) continue;
      if (st.loops) {
        const curve = new THREE.CatmullRomCurve3(c.pts.map(p => lift(p, c.m)), c.closed);
        const g = new THREE.TubeGeometry(curve, c.pts.length * 2, .08, 10, c.closed);
        const cols = new Float32Array(g.attributes.position.count * 3);
        for (let i = 0; i < cols.length; i += 3) { cols[i] = color.r; cols[i + 1] = color.g; cols[i + 2] = color.b; }
        g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        loopGroup.add(new THREE.Mesh(g, loopMat));
      }
      if (st.tracers) for (let k = 0; k < K; k++) {
        const t = TWO * (k + .5) / K;
        let p;
        if (c.closed) p = loopPoint(c.phi, t);
        else { if (t >= psi) continue; p = loopPoint(t, (Pj - st.g - st.nt * t + TWO * c.b) / st.np); }
        putArrow(tracerArrows, nt++, lift(p, c.m), dir, color);
      }
    }
  }
  finishArrows(tracerArrows, nt);
  let nballs = 0;
  if (stuck && st.cc && st.loops) for (const p of contact.spots.slice(0, 64)) {
    balls.setMatrixAt(nballs++, tmpM.makeTranslation(p.x, p.y, p.z));
  }
  balls.count = nballs; balls.instanceMatrix.needsUpdate = true;

  // 3D spin lattice of the finished hopfion (lower half, z <= 0)
  let nl = 0, nb = 0;
  if (done && st.spins && !st.po && !pulled) for (let x = -8; x <= 8; x++) for (let y = -8; y <= 8; y++) for (let z = -4; z <= 0; z++) {
    const m = mField(x, y, z), p = new THREE.Vector3(x, y, z);
    if (m.z > .8) putArrow(bgArrows, nb++, p, m, spinColor(m, tmpC));
    else putArrow(latticeArrows, nl++, p, m, spinColor(m, tmpC));
  }
  finishArrows(latticeArrows, nl); finishArrows(bgArrows, nb);

  // labels
  const Q = -st.np * st.nt;
  $('vpa').textContent = st.pa.toFixed(2);
  const ps = $('pstat');
  ps.dataset.lam = contact.lam.toFixed(4);
  ps.classList.toggle('stuck', stuck);
  ps.textContent = st.po ? '' : !curves.length ? (sweeping ? 'No loops for n_pol = n_tor = 0.' : 'Build the hopfion first (Skyrmion → Hopfion).')
    : stuck ? `Stuck at ${pull.toFixed(2)}: two loops touch (yellow ball). Linked loops cannot be pulled apart.`
    : !pulled ? 'Slide the loops apart along the z axis.'
    : contact.lam > 1 ? (st.pa > .999 ? 'Apart: the loops slid past each other without touching. They are not linked.'
      : 'The loops slide past each other without touching.')
    : 'Pulling…';
  $('vs').textContent = st.s.toFixed(2);
  $('stage').textContent = st.s < .2 ? 'Flat skyrmion: its spins turn about x'
    : st.s < .4 ? 'The skyrmion stands up beside the z axis'
    : !done ? `Sweeping round z, spins turning ${st.nt} time(s): ${Math.round(psi / TWO * 100)}%`
    : 'Hopfion complete';
  $('vnp').textContent = st.np; $('vnt').textContent = st.nt;
  const gd = Math.round(st.g * 180 / Math.PI);
  $('vg').textContent = `${gd}°` + (Math.abs(gd) % 180 === 0 ? ' (Néel)' : Math.abs(gd) === 90 ? ' (Bloch)' : '');
  $('vop').textContent = st.op.toFixed(2);
  $('qh').textContent = `Hopf number  Q_H = ${Q === 0 ? 0 : Q}`;
  $('qtext').textContent = Q === 0
    ? 'Q_H = 0: the coloured loops do not link — no hopfion.'
    : `Any two loops of different colour link ${Math.abs(Q)} time${Math.abs(Q) > 1 ? 's' : ''}.`
      + (done ? '' : ' (finish the build to see it)');
}
const $ = id => document.getElementById(id);

let dirty = true;
const bind = (id, key, f = Number) => $(id).addEventListener('input', e => { st[key] = f(e.target.value); dirty = true; });
bind('s', 's'); bind('np', 'np'); bind('nt', 'nt'); bind('g', 'g', v => v * Math.PI / 180); bind('op', 'op');
bind('pa', 'pa');
for (const [id, key] of [['po', 'po'], ['cl', 'loops'], ['ct', 'tracers'], ['cs', 'spins'], ['cc', 'cc']])
  $(id).addEventListener('change', e => { st[key] = e.target.checked; dirty = true; });

renderer.setAnimationLoop(() => {
  if (dirty) { build(); dirty = false; }
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
